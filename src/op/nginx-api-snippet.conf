# 放进 edu.jsoner.cn 的 http {} 或 include 前（zone 只能声明一次）：
# limit_req_zone $binary_remote_addr zone=eduhub_api:10m rate=20r/s;
# limit_req_zone $binary_remote_addr zone=eduhub_auth:10m rate=5r/m;

# 放进 edu.jsoner.cn 的 server {}，不要写进 jsoner.cn。
# blog 的 jsoner-api 已占用 8080，本站 API 用 8081。
location /api/login {
    limit_req zone=eduhub_auth burst=3 nodelay;
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
}

location /api/ {
    limit_req zone=eduhub_api burst=40 nodelay;
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
}

location / {
    try_files $uri $uri/ /index.html;
}
